# AIMeetingMoM Production Nginx Reverse Proxy Configuration
# Target Architecture: GCP VM e2-standard-4 with Cloudflare Edge SSL/DNS
# Place this file in /etc/nginx/sites-available/aimeetingmom and symlink to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain name (e.g., mom.yourdomain.com) or external IP

    root /opt/aimeetingmom/frontend/dist;
    index index.html;

    # Gzip Compression for modern web speed & SEO performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # Allow 25MB audio slice chunks with safety margin (35MB limit)
    # Bypasses Cloudflare 100MB body limit safely via frontend File.slice chunking
    client_max_body_size 35M;
    client_body_buffer_size 128k;

    # Frontend Single-Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets cache control (Vite hashes filenames in dist/assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse Proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        
        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeout allowances for audio chunk reassembly and background worker pooling
        # Note: Long STT runs in FastAPI BackgroundTasks, but chunk streaming needs stable TCP windows
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Do not buffer backend responses to ensure real-time streaming audio playback
        proxy_buffering off;
    }

    # Deny access to hidden files and SQLite DBs
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sqlite|db|log|env)$ {
        deny all;
        return 404;
    }
}
